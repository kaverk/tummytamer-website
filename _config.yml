# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Easy Data Entry
    description                           : We designed Tummy Tamer to be the quickest, easiest food diary app there is.
    fontawesome_icon_name                 : pot-food
    
  - title                                 : Go Beyond Food
    description                           : Track other metrics that affect your tummy like stress, exercise, medications, and BMs.
    fontawesome_icon_name                 : capsules
    
  - title                                 : Detailed or Broad
    description                           : Want to track all ingredients? Great. Want general meal notes instead? Awesome! We support any level of detail.
    fontawesome_icon_name                 : square-info

  - title                                 : See Trends
    description                           : Quickly view past meal info in graphical form to spot food triggers and symptom patterns.
    fontawesome_icon_name                 : chart-line

  - title                                 : Generate Reports
    description                           : Create a report of all food intake, symptoms, and other metrics for your own use or to share with your health professional. (COMING SOON)
    fontawesome_icon_name                 : file-lines

  - title                                 : Get Reminders
    description                           : Get reminders to enter your data after each meal, or just once a day. 
    fontawesome_icon_name                 : alarm-clock
  
  - title                                 : More Features Coming
    description                           : We've got all sorts of great ideas to continue making this 
    fontawesome_icon_name                 : star




